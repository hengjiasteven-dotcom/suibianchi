# 随便吃 · Nginx 反向代理（API 子域）
# 放到 /etc/nginx/conf.d/shiji-api.conf 或宝塔的站点配置里
# 证书推荐用 certbot 自动签发：certbot --nginx -d api.xiaodaidai.site

server {
    listen 80;
    server_name api.xiaodaidai.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.xiaodaidai.site;

    ssl_certificate     /etc/letsencrypt/live/api.xiaodaidai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xiaodaidai.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 一次最多 6 张照片，客户端按 base64 上传，给小一点别把大图拦掉
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 识图 / 估算走大模型，别 60 秒就断
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
